name: CI Pipeline

on:
  pull_request:
    branches: [ develop ]

jobs:
  updatereadme:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Update README
        run: echo "Actualizando README"

  validate-dev:
    needs: updatereadme
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate Dev
        run: echo "Validando entorno de desarrollo"
