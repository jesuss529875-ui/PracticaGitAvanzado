name: CI Pipeline

on:
  pull_request:
    branches: [ develop ]

jobs:
  updatereadme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Update README
        run: echo "Actualizando README"

  validate-dev:
    needs: updatereadme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate Dev Token
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          # Simulamos la validación comparando el secreto con un valor que no coincide
          LOCAL_DEV_TOKEN="token_incorrecto_123"
          if [ "$DEV_TOKEN" != "$LOCAL_DEV_TOKEN" ]; then
            echo "Error: El token local no coincide con el secreto de desarrollo."
            exit 1
          fi
